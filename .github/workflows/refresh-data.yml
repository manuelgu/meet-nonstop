name: Refresh route data

on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Rebuild route graph from Wikipedia
        run: node pipeline/src/index.ts

      - name: Commit if the data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No route changes this week."
          else
            node -e "const m=require('./data/meta.json');console.log('routes:',m.routes,'reciprocity:',m.reciprocalRate)"
            git commit -m "chore(data): weekly route refresh"
            git push
          fi
          # The push fires GitHub's webhook, so Cloudflare Workers Builds
          # redeploys on its own. (GITHUB_TOKEN pushes do not re-trigger
          # GitHub Actions workflows, but external webhooks are unaffected.)
